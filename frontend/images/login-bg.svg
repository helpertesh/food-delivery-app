<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff8a3d"/>
      <stop offset="45%" stop-color="#f04e6a"/>
      <stop offset="100%" stop-color="#6a3fb5"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.2" r="0.5">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.8" cy="0.85" r="0.55">
      <stop offset="0%" stop-color="#41d764" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#41d764" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow3" cx="0.85" cy="0.15" r="0.4">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <g id="plate">
      <circle r="34" fill="none" stroke="#fff" stroke-width="3"/>
      <circle r="22" fill="none" stroke="#fff" stroke-width="2"/>
    </g>
    <g id="fork" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 -36 V36"/>
      <path d="M-9 -36 V-16 Q-9 -4 0 -4 Q9 -4 9 -16 V-36"/>
      <path d="M-3 -36 V-14 M3 -36 V-14"/>
    </g>
    <g id="knife" stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M0 -36 V36"/>
      <path d="M0 -36 Q12 -20 10 -2 Q6 0 0 0"/>
    </g>
    <g id="pizza" stroke="#fff" stroke-width="3" stroke-linejoin="round" fill="none">
      <path d="M-30 -24 L30 -24 L0 36 Z"/>
      <path d="M-30 -24 Q0 -36 30 -24"/>
      <circle cx="-6" cy="-10" r="4" fill="#fff" stroke="none"/>
      <circle cx="10" cy="-2" r="4" fill="#fff" stroke="none"/>
      <circle cx="-2" cy="12" r="4" fill="#fff" stroke="none"/>
    </g>
    <g id="cup" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M-22 -18 H22 L16 30 H-16 Z"/>
      <path d="M22 -8 Q40 -6 36 10 Q32 20 18 18"/>
      <path d="M-26 -26 H26"/>
    </g>
    <g id="burger" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <path d="M-32 -12 Q0 -40 32 -12 Z"/>
      <path d="M-34 -2 H34"/>
      <path d="M-32 8 Q-24 16 -16 8 Q-8 16 0 8 Q8 16 16 8 Q24 16 32 8"/>
      <path d="M-30 18 H30 Q34 26 26 32 H-26 Q-34 26 -30 18 Z"/>
    </g>
    <g id="icecream" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" fill="none">
      <circle cx="0" cy="-16" r="18"/>
      <path d="M-18 -8 L0 38 L18 -8"/>
      <path d="M-10 6 L10 6 M-5 18 L5 18"/>
    </g>
    <pattern id="icons" width="380" height="300" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <g opacity="0.16">
        <use href="#plate" x="60" y="60"/>
        <use href="#fork" x="170" y="80" transform="rotate(-20 170 80)"/>
        <use href="#knife" x="200" y="80" transform="rotate(-20 200 80)"/>
        <use href="#pizza" x="300" y="60" transform="rotate(15 300 60)"/>
        <use href="#cup" x="70" y="210"/>
        <use href="#burger" x="200" y="220"/>
        <use href="#icecream" x="320" y="210" transform="rotate(-10 320 210)"/>
      </g>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow1)"/>
  <rect width="1600" height="1000" fill="url(#glow2)"/>
  <rect width="1600" height="1000" fill="url(#glow3)"/>
  <rect width="1600" height="1000" fill="url(#icons)"/>
  <circle cx="1320" cy="180" r="220" fill="#fff" opacity="0.06"/>
  <circle cx="260" cy="820" r="300" fill="#fff" opacity="0.05"/>
</svg>
