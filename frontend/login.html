<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Food Delivery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #41d764 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #151a22 0%, #241a35 100%);
            color: #e8e8e8;
        }

        body.dark-mode::before {
            filter: brightness(0.55) saturate(0.85);
        }

        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background-image: var(--login-bg, url('images/login-bg.svg'));
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 1;
            z-index: 0;
            animation: zoom 20s infinite alternate;
        }

        @keyframes zoom {
            0% {
                transform: scale(1);
            }
            100% {
                transform: scale(1.1);
            }
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            position: relative;
            z-index: 1;
        }

        body.dark-mode .container {
            background: #1f2432;
            color: #e8e8e8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h2 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 2em;
        }

        body.dark-mode h2 {
            color: #f1f1f1;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: 500;
        }

        body.dark-mode label,
        body.dark-mode .signup-link {
            color: #c9c9c9;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        body.dark-mode input {
            background: #2a2f3c;
            color: #f0f0f0;
            border-color: #4a5163;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #764ba2;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .help-text {
            font-size: 0.85em;
            color: #777;
            margin-top: 6px;
        }

        body.dark-mode .help-text {
            color: #a9a9a9;
        }

        .links-row {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 16px;
            font-size: 0.95em;
        }

        .links-row a {
            color: #667eea;
            text-decoration: none;
        }

        .links-row a:hover {
            text-decoration: underline;
        }

        .theme-toggle {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 2;
            border: 1px solid rgba(255,255,255,0.3);
            background: rgba(25, 32, 54, 0.58);
            color: white;
            border-radius: 8px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <button type="button" id="themeToggle" class="theme-toggle">🌙 Dark</button>
    <div class="container">
        <h2 id="formTitle">Login</h2>
        
        <div class="error" id="errorMessage"></div>
        <div class="success" id="successMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <button type="submit" class="btn">Login</button>

            <div class="links-row">
                <a href="#" id="showResetLink">Forgot password?</a>
                <a href="signup.html">Create an account</a>
            </div>
        </form>

        <form id="resetForm" style="display: none;">
            <div class="form-group">
                <label for="resetEmail">Email</label>
                <input type="email" id="resetEmail" name="resetEmail" autocomplete="email">
            </div>

            <div class="form-group">
                <label for="resetPhone">Phone number used at sign up</label>
                <input type="tel" id="resetPhone" name="resetPhone" placeholder="07XXXXXXXX" autocomplete="tel">
                <div class="help-text">We check this against your account instead of sending an email.</div>
            </div>

            <div class="form-group">
                <label for="resetNewPassword">New password</label>
                <input type="password" id="resetNewPassword" name="resetNewPassword" minlength="6" autocomplete="new-password">
            </div>

            <div class="form-group">
                <label for="resetConfirmPassword">Confirm new password</label>
                <input type="password" id="resetConfirmPassword" name="resetConfirmPassword" minlength="6" autocomplete="new-password">
            </div>

            <button type="submit" class="btn" id="resetSubmitBtn">Set new password</button>

            <div class="links-row">
                <a href="#" id="backToLoginLink">&larr; Back to login</a>
                <a href="signup.html">Create an account</a>
            </div>
        </form>

        <div class="signup-link">
            Already logged in? Change your password from the <a href="profile.html">Profile</a> page.
        </div>
    </div>

    <script>
        const API_BASE = window.location.protocol === 'file:' ? 'http://localhost:3000' : window.location.origin;
        function applyTheme(theme) {
            const dark = theme === 'dark';
            document.body.classList.toggle('dark-mode', dark);
            const btn = document.getElementById('themeToggle');
            if (btn) btn.textContent = dark ? '☀ Light' : '🌙 Dark';
        }
        (function initTheme() {
            const stored = localStorage.getItem('themeMode');
            applyTheme(stored === 'dark' ? 'dark' : 'light');
            const btn = document.getElementById('themeToggle');
            if (!btn) return;
            btn.addEventListener('click', () => {
                const next = document.body.classList.contains('dark-mode') ? 'light' : 'dark';
                localStorage.setItem('themeMode', next);
                applyTheme(next);
            });
        })();

        const loginForm = document.getElementById('loginForm');
        const resetForm = document.getElementById('resetForm');
        const errorBox = document.getElementById('errorMessage');
        const successBox = document.getElementById('successMessage');

        function showMessage(box, text) {
            errorBox.style.display = 'none';
            successBox.style.display = 'none';
            if (!box) return;
            box.textContent = text;
            box.style.display = 'block';
        }

        function showResetForm(show) {
            showMessage(null);
            loginForm.style.display = show ? 'none' : 'block';
            resetForm.style.display = show ? 'block' : 'none';
            document.getElementById('formTitle').textContent = show ? 'Reset password' : 'Login';
            if (show) {
                const typedEmail = document.getElementById('email').value;
                if (typedEmail) document.getElementById('resetEmail').value = typedEmail;
                document.getElementById('resetEmail').focus();
            }
        }

        document.getElementById('showResetLink').addEventListener('click', (e) => {
            e.preventDefault();
            showResetForm(true);
        });
        document.getElementById('backToLoginLink').addEventListener('click', (e) => {
            e.preventDefault();
            showResetForm(false);
        });

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const phone = document.getElementById('resetPhone').value.trim();
            const newPassword = document.getElementById('resetNewPassword').value;
            const confirm = document.getElementById('resetConfirmPassword').value;

            if (!email || !phone || !newPassword) {
                showMessage(errorBox, 'Please fill in email, phone, and the new password.');
                return;
            }
            if (newPassword.length < 6) {
                showMessage(errorBox, 'New password must be at least 6 characters.');
                return;
            }
            if (newPassword !== confirm) {
                showMessage(errorBox, 'The two passwords do not match.');
                return;
            }

            const btn = document.getElementById('resetSubmitBtn');
            btn.disabled = true;
            btn.textContent = 'Updating…';
            try {
                const response = await fetch(`${API_BASE}/api/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, phone, newPassword }),
                });
                const data = await response.json().catch(() => ({}));
                if (response.ok && data.success) {
                    showResetForm(false);
                    document.getElementById('email').value = email;
                    document.getElementById('password').value = '';
                    showMessage(successBox, data.message || 'Password updated. Log in with your new password.');
                    resetForm.reset();
                } else {
                    showMessage(errorBox, data.message || 'Could not reset password. Please try again.');
                }
            } catch (err) {
                console.error('❌ Reset password error:', err);
                showMessage(errorBox, 'Network error. Make sure the server is running and try again.');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Set new password';
            }
        });

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('errorMessage');
            showMessage(null);

            const formData = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                console.log('🔄 Attempting login...');
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                console.log('📡 Response status:', response.status);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({ message: 'Server error' }));
                    errorDiv.textContent = errorData.message || 'Login failed. Please try again.';
                    errorDiv.style.display = 'block';
                    return;
                }

                const data = await response.json();
                console.log('✅ Login response:', data);

                if (data.success) {
                    // Store user data in sessionStorage
                    sessionStorage.setItem('user', JSON.stringify(data.user));
                    console.log('✅ User data stored, redirecting...');
                    
                    // Redirect to dashboard
                    window.location.href = 'home.html';
                } else {
                    errorDiv.textContent = data.message || 'Login failed. Please check your credentials.';
                    errorDiv.style.display = 'block';
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                errorDiv.textContent = 'Network error. Open the app from the same host as the API (e.g. http://localhost:3000 or your Vercel URL), or start the backend locally.';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
