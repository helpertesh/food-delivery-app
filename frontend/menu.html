<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Food Delivery</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="menu">
    <div class="page-bg" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <div id="app-nav"></div>

    <div class="container page-container">
        <header class="page-hero animate-in">
            <span class="page-hero-icon">🍽️</span>
            <h1>Our Menu</h1>
            <p>Explore categories, pick your favorites, and add them to your cart in one tap.</p>
        </header>

        <div class="category-nav animate-in delay-1" id="categoryNav"></div>

        <div class="menu-section animate-in delay-2" id="menu">
            <h2>
                <span>Dishes</span>
                <span style="font-size: 1rem; color: #666; font-weight: 500;" id="itemCount"></span>
            </h2>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Loading delicious food...</p>
            </div>

            <div class="menu-grid" id="menuGrid"></div>
        </div>
    </div>

    <div id="app-modals"></div>
    <script src="js/app.js"></script>
</body>
</html>
