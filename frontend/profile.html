<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Food Delivery</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="profile">
    <div class="page-bg" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <div id="app-nav"></div>

    <div class="container page-container">
        <div class="profile-section animate-in" id="profile">
            <div class="profile-header">
                <div class="profile-avatar" id="profileAvatar">👤</div>
                <div>
                    <h2 id="profileDisplayName">Your Profile</h2>
                    <p id="profileDisplayEmail">Loading…</p>
                </div>
            </div>
            <div class="info-grid" id="userInfo"></div>
        </div>

        <div class="profile-section password-section animate-in delay-1" id="passwordSection">
            <h3>🔒 Change password</h3>
            <p class="password-intro">Enter your current password, then choose a new one (at least 6 characters).</p>
            <form id="changePasswordForm" class="password-form" autocomplete="off">
                <div class="password-field">
                    <label for="currentPassword">Current password</label>
                    <input type="password" id="currentPassword" autocomplete="current-password" required>
                </div>
                <div class="password-row">
                    <div class="password-field">
                        <label for="newPassword">New password</label>
                        <input type="password" id="newPassword" minlength="6" autocomplete="new-password" required>
                    </div>
                    <div class="password-field">
                        <label for="confirmPassword">Confirm new password</label>
                        <input type="password" id="confirmPassword" minlength="6" autocomplete="new-password" required>
                    </div>
                </div>
                <div class="password-msg" id="passwordMsg" role="status"></div>
                <button type="submit" class="password-btn" id="changePasswordBtn">Update password</button>
            </form>
        </div>
    </div>

    <div id="app-modals"></div>
    <script src="js/app.js"></script>
</body>
</html>
