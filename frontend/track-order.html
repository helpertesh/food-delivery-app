<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Order - Food Delivery</title>
    <link rel="stylesheet" href="css/app.css">
    <link rel="stylesheet" href="css/pages.css">
</head>
<body data-page="track-order">
    <div class="page-bg" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
    </div>

    <div id="app-nav"></div>

    <div class="container page-container">
        <header class="page-hero animate-in">
            <span class="page-hero-icon">📍</span>
            <h1>Track Your Order</h1>
            <p>Follow preparation, transit, and delivery in real time. Live kitchen view appears while your order is <strong>Preparing</strong>.</p>
        </header>

        <div class="feature-strip animate-in delay-1" id="trackOrdersSection">
            <div id="trackOrdersPanel">
                <p style="color:#888;">Loading…</p>
            </div>
        </div>
    </div>

    <div id="app-modals"></div>
    <script src="js/app.js"></script>
</body>
</html>
